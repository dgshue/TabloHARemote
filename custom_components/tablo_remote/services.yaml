set_channel:
  name: Set channel
  description: >-
    Tune the Tablo to a channel. If a Roku is given, this powers on the
    Roku/TV and deep-links the Tablo app straight to the channel (live) — going
    from a cold TV to watching the channel in one call. Either channel_id or
    channel_number must be provided.
  fields:
    channel_id:
      name: Channel ID
      description: The channel identifier (e.g. "S122912_503_01").
      required: false
      example: "S122912_503_01"
      selector:
        text:
    channel_number:
      name: Channel number
      description: The channel number in major.minor format (e.g. "2.1").
      required: false
      example: "2.1"
      selector:
        text:
    roku_entity_id:
      name: Roku entity
      description: >-
        The media_player entity of the Roku to send this channel to. With
        multiple Rokus, call set_channel once per Roku to put a different
        channel on each. Overrides the Roku set in the integration options.
      required: false
      example: media_player.roku_living_room
      selector:
        entity:
          domain: media_player
    turn_on:
      name: Turn on TV
      description: >-
        Power on the Roku (and the TV via HDMI-CEC) before tuning. Only applies
        when a Roku is targeted. Defaults to true.
      required: false
      default: true
      selector:
        boolean:
    launch_app:
      name: Launch Tablo app
      description: >-
        Launch the Tablo app on the Roku before tuning. Only applies when a
        Roku is targeted. Defaults to true.
      required: false
      default: true
      selector:
        boolean:

get_channels:
  name: Get channels
  description: Fetch the list of available channels from the Tablo account.

stop_streaming:
  name: Stop streaming
  description: Stop the current stream (placeholder, not yet implemented).
